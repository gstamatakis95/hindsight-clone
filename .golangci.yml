version: "2"
linters:
  default: standard
  enable: [gocyclo, lll, revive, godot, depguard, errorlint, wrapcheck, contextcheck, gosec]
  settings:
    gocyclo:
      min-complexity: 15        # McCabe: anything above 15 fails
    lll:
      line-length: 120
    revive:
      rules:
        - name: exported        # doc comment on every exported identifier
        - name: package-comments
        - name: unused-parameter
    wrapcheck:
      # errors crossing a boundary are already domain error classes (the jobs catalogue returns the store's)
      ignore-package-globs: ["memd/internal/store", "memd/internal/graph", "memd/internal/ai", "memd/internal/blob",
        "memd/internal/jobs"]
    depguard:
      rules:
        engines:
          files: ["**/internal/engine/**", "!$test"]   # tests may use pgtest and pgx: store code runs on real Postgres
          deny:
            - pkg: "memd/internal/store/postgres"
              desc: engines depend on the store interfaces only
            - pkg: "memd/internal/ai/gateway"
              desc: engines depend on the ai interfaces only
            - pkg: "memd/internal/blob/s3"
              desc: engines depend on blob.Store only
            - pkg: "memd/internal/grpcapi"
              desc: engines don't know about gRPC
            - pkg: "memd/internal/maintenance"
              desc: the maintenance tick sits above the engines
            - pkg: "memd/gen"
              desc: no proto types in engines; use domain
            - pkg: "github.com/jackc/pgx"
              desc: use store.DB
            - pkg: "net/http"
              desc: use ai.LLM / ai.Embedder / ai.Reranker
            - pkg: "github.com/aws"
              desc: use blob.Store
            - pkg: "github.com/DataDog"
              desc: observability is wired in cmd/memd via internal/observability; engines stay vendor-free
        svc-mentalmodel:
          files: ["**/internal/mentalmodel/**", "!$test"]   # tests use pgtest
          deny:
            - pkg: "memd/internal/store/postgres"
              desc: services depend on the store interfaces only
            - pkg: "memd/internal/ai/gateway"
              desc: services depend on the ai interfaces only
            - pkg: "memd/internal/blob/s3"
              desc: services depend on blob.Store only
            - pkg: "memd/internal/grpcapi"
              desc: services don't know about gRPC
            - pkg: "memd/internal/maintenance"
              desc: the maintenance tick sits above the services
            - pkg: "memd/gen"
              desc: no proto types in services; use domain
            - pkg: "github.com/jackc/pgx"
              desc: use store.DB
            - pkg: "net/http"
              desc: use ai.LLM / ai.Embedder / ai.Reranker
            - pkg: "github.com/aws"
              desc: use blob.Store
            - pkg: "github.com/DataDog"
              desc: services stay vendor-free
        svc-mentalmodel-features:
          files: ["**/internal/mentalmodel/**"]
          deny:
            - pkg: "memd/internal/engine"
              desc: services never import each other; enqueue the other service's job instead
            - pkg: "memd/internal/memory"
              desc: services never import each other; enqueue the other service's job instead
            - pkg: "memd/internal/document"
              desc: services never import each other; enqueue the other service's job instead
            - pkg: "memd/internal/observation"
              desc: services never import each other; enqueue the other service's job instead
            - pkg: "memd/internal/bank"
              desc: services never import each other; enqueue the other service's job instead
            - pkg: "memd/internal/configsvc"
              desc: services never import each other; enqueue the other service's job instead
            - pkg: "memd/internal/operation"
              desc: services never import each other; enqueue the other service's job instead
        graph:
          files: ["**/internal/graph/*.go"]   # the boundary; graphtest may use store to seed units
          deny:
            - pkg: "memd/internal/store"
              desc: the graph boundary imports only domain (store imports graph for Tx.Graph)
            - pkg: "memd/internal/config"
              desc: the graph boundary imports only domain
            - pkg: "memd/internal/jobs"
              desc: the graph boundary imports only domain
            - pkg: "memd/internal/ai"
              desc: the graph boundary imports only domain
            - pkg: "memd/internal/blob"
              desc: the graph boundary imports only domain
            - pkg: "memd/internal/engine"
              desc: the graph boundary imports only domain
            - pkg: "memd/internal/recall"
              desc: the graph boundary imports only domain
            - pkg: "memd/internal/reflect"
              desc: the graph boundary imports only domain
            - pkg: "memd/internal/timex"
              desc: the graph boundary imports only domain
            - pkg: "memd/internal/linking"
              desc: the graph boundary imports only domain
            - pkg: "memd/internal/grpcapi"
              desc: the graph boundary imports only domain
            - pkg: "memd/internal/maintenance"
              desc: the graph boundary imports only domain
            - pkg: "memd/gen"
              desc: no proto types in the graph boundary
            - pkg: "github.com/jackc/pgx"
              desc: only store/postgres uses pgx
            - pkg: "github.com/DataDog"
              desc: the graph boundary stays vendor-free
        libraries:
          files: ["**/internal/recall/**", "**/internal/reflect/**", "**/internal/timex/**", "**/internal/linking/**",
            "!$test"]   # tests use pgtest
          deny:
            - pkg: "memd/internal/engine"
              desc: libraries never import the engines (services)
            - pkg: "memd/internal/grpcapi"
              desc: libraries don't know about gRPC
            - pkg: "memd/internal/maintenance"
              desc: the maintenance tick sits above the libraries
            - pkg: "memd/internal/store/postgres"
              desc: libraries depend on the store and graph interfaces only
            - pkg: "memd/internal/ai/gateway"
              desc: libraries depend on the ai interfaces only
            - pkg: "memd/internal/blob/s3"
              desc: libraries depend on blob.Store only
            - pkg: "memd/gen"
              desc: no proto types in libraries; use domain
            - pkg: "github.com/jackc/pgx"
              desc: use store.DB
            - pkg: "net/http"
              desc: use ai.LLM / ai.Embedder / ai.Reranker
            - pkg: "github.com/aws"
              desc: use blob.Store
            - pkg: "github.com/DataDog"
              desc: libraries stay vendor-free
        library-timex-linking:
          files: ["**/internal/timex/**", "**/internal/linking/**"]
          deny:
            - pkg: "memd/internal/recall"
              desc: timex and linking sit below recall
            - pkg: "memd/internal/reflect"
              desc: timex and linking sit below reflect
        library-recall:
          files: ["**/internal/recall/**"]
          deny:
            - pkg: "memd/internal/reflect"
              desc: recall sits below reflect (reflect imports recall)
            - pkg: "memd/internal/linking"
              desc: recall never links
        grpcapi:
          files: ["**/internal/grpcapi/**"]
          deny:
            - pkg: "memd/internal/store/postgres"
              desc: handlers call engines
            - pkg: "memd/internal/ai/gateway"
              desc: handlers call engines
            - pkg: "memd/internal/blob/s3"
              desc: handlers call engines
            - pkg: "memd/internal/maintenance"
              desc: handlers never run the maintenance tick
            - pkg: "github.com/jackc/pgx"
              desc: handlers call engines; the Postgres probe takes the pool's Ping
        domain:
          files: ["**/internal/domain/**"]
          deny:
            - pkg: "memd/internal"
              desc: domain imports nothing internal
            - pkg: "memd/gen"
              desc: no proto types in domain
            - pkg: "github.com/DataDog"
              desc: domain stays vendor-free
        contracts:
          files: ["**/internal/store/*.go", "**/internal/ai/*.go", "**/internal/blob/*.go", "**/internal/clock/*.go"]
          deny:
            - pkg: "memd/internal/store/postgres"
              desc: contracts never see adapters
            - pkg: "memd/internal/ai/gateway"
              desc: contracts never see adapters
            - pkg: "memd/internal/blob/s3"
              desc: contracts never see adapters
            - pkg: "memd/internal/config"
              desc: contracts sit below config
            - pkg: "memd/internal/engine"
              desc: contracts sit below the engines
            - pkg: "memd/internal/recall"
              desc: contracts sit below the libraries
            - pkg: "memd/internal/reflect"
              desc: contracts sit below the libraries
            - pkg: "memd/internal/timex"
              desc: contracts sit below the libraries
            - pkg: "memd/internal/linking"
              desc: contracts sit below the libraries
            - pkg: "memd/internal/grpcapi"
              desc: contracts sit below the gRPC API
            - pkg: "memd/internal/jobs"
              desc: contracts sit below jobs
            - pkg: "memd/internal/maintenance"
              desc: contracts sit below maintenance
            - pkg: "memd/gen"
              desc: no proto types in contracts
            - pkg: "github.com/jackc/pgx"
              desc: only store/postgres uses pgx
            - pkg: "github.com/aws"
              desc: only blob/s3 uses the AWS SDK
            - pkg: "github.com/DataDog"
              desc: contracts stay vendor-free
        adapters:
          files: ["**/internal/store/postgres/**", "**/internal/ai/gateway/**", "**/internal/blob/s3/**", "!$test"]
          deny:
            - pkg: "memd/internal/config"
              desc: adapters translate; they never decide
            - pkg: "memd/internal/engine"
              desc: adapters never import engines
            - pkg: "memd/internal/recall"
              desc: adapters never import libraries
            - pkg: "memd/internal/reflect"
              desc: adapters never import libraries
            - pkg: "memd/internal/timex"
              desc: adapters never import libraries
            - pkg: "memd/internal/linking"
              desc: adapters never import libraries
            - pkg: "memd/internal/grpcapi"
              desc: adapters never import the gRPC API
            - pkg: "memd/internal/jobs"
              desc: adapters satisfy jobs.Claimer structurally; they never import jobs
            - pkg: "memd/internal/maintenance"
              desc: adapters never import maintenance
            - pkg: "memd/gen"
              desc: no proto types in adapters
        jobs:
          files: ["**/internal/jobs/**", "!$test"]   # tests run the runner on pgtest
          deny:
            - pkg: "memd/internal/engine"
              desc: jobs sits below the engines; they import it
            - pkg: "memd/internal/recall"
              desc: jobs sits below the libraries
            - pkg: "memd/internal/reflect"
              desc: jobs sits below the libraries
            - pkg: "memd/internal/timex"
              desc: jobs sits below the libraries
            - pkg: "memd/internal/linking"
              desc: jobs sits below the libraries
            - pkg: "memd/internal/config"
              desc: jobs sits beside config, below the engines
            - pkg: "memd/internal/grpcapi"
              desc: jobs doesn't know about gRPC
            - pkg: "memd/internal/maintenance"
              desc: the maintenance tick sits above jobs
            - pkg: "memd/internal/store/postgres"
              desc: jobs depends on store and jobs.Claimer only
            - pkg: "memd/internal/ai"
              desc: no model calls in the job runtime
            - pkg: "memd/internal/blob"
              desc: no blob calls in the job runtime
            - pkg: "memd/gen"
              desc: no proto types in jobs
            - pkg: "github.com/jackc/pgx"
              desc: use store.DB and jobs.Claimer
            - pkg: "net/http"
              desc: no network calls in the job runtime
            - pkg: "github.com/aws"
              desc: no blob calls in the job runtime
            - pkg: "github.com/DataDog"
              desc: tracing comes in through Config.TraceJob
        maintenance:
          files: ["**/internal/maintenance/**", "!$test"]   # tests use pgtest
          deny:
            - pkg: "memd/internal/grpcapi"
              desc: maintenance doesn't know about gRPC
            - pkg: "memd/internal/store/postgres"
              desc: maintenance depends on the store interfaces only
            - pkg: "memd/internal/ai/gateway"
              desc: maintenance depends on the ai interfaces only
            - pkg: "memd/internal/blob/s3"
              desc: maintenance depends on blob.Store only
            - pkg: "memd/gen"
              desc: no proto types in maintenance
            - pkg: "github.com/jackc/pgx"
              desc: use store.DB
            - pkg: "net/http"
              desc: no network calls in maintenance
            - pkg: "github.com/aws"
              desc: use blob.Store
            - pkg: "github.com/DataDog"
              desc: tracing comes in through Deps.TraceTick
formatters:
  enable: [gofumpt, goimports]
