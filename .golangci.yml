        maintenance:
          files: ["**/internal/maintenance/**", "!$test"]   # tests use pgtest
          deny:
            - pkg: "memd/internal/grpcapi"
              desc: maintenance doesn't know about gRPC
            - pkg: "memd/internal/store/postgres"
              desc: maintenance depends on the store interfaces only
            - pkg: "memd/internal/ai/gateway"
              desc: maintenance depends on the ai interfaces only
            - pkg: "memd/internal/blob/s3"
              desc: maintenance depends on blob.Store only
            - pkg: "memd/gen"
              desc: no proto types in maintenance
            - pkg: "github.com/jackc/pgx"
              desc: use store.DB
            - pkg: "net/http"
              desc: no network calls in maintenance
            - pkg: "github.com/aws"
              desc: use blob.Store
            - pkg: "github.com/DataDog"
              desc: tracing comes in through Deps.TraceTick
        grpcapi:
          files: ["**/internal/grpcapi/**"]
          deny:
            - pkg: "memd/internal/store/postgres"
              desc: handlers call services
            - pkg: "memd/internal/ai/gateway"
              desc: handlers call services
            - pkg: "memd/internal/blob/s3"
              desc: handlers call services
            - pkg: "memd/internal/jobs"
              desc: handlers never enqueue; services do
            - pkg: "memd/internal/maintenance"
              desc: handlers never run the maintenance tick
            - pkg: "github.com/jackc/pgx"
              desc: handlers call services; the Postgres probe takes the pool's Ping
