="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="164" dy="0">UpdateMemory</tspan><tspan x="164" dy="22">edit a live fact,</tspan><tspan x="164" dy="22">clear its embedding</tspan></text></g><g class="cnBjcy5pbnZhbGlkYXRl tx"><g class="shape" ><rect x="316" y="48" width="280" height="100" rx="8" stroke="#14586a" fill="#1f7f92" style="stroke-width:2;" /></g><text x="456" y="85" fill="#ffffff" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="456" dy="0">InvalidateMemory</tspan><tspan x="456" dy="22">archive a live fact</tspan><tspan x="456" dy="22">with snapshots</tspan></text></g><g class="cnBjcy5yZXN0b3Jl tx"><g class="shape" ><rect x="608" y="48" width="280" height="100" rx="8" stroke="#14586a" fill="#1f7f92" style="stroke-width:2;" /></g><text x="748" y="85" fill="#ffffff" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="748" dy="0">RestoreMemory</tspan><tspan x="748" dy="22">bring an archived</tspan><tspan x="748" dy="22">fact back</tspan></text></g><g class="am9icy5yZWRlcml2ZQ== job"><g class="shape" ><rect x="30" y="467" width="420" height="100" rx="8" stroke="#8a430a" fill="#b85c10" style="stroke-width:2;" /></g><text x="240" y="504" fill="#ffffff" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="240" dy="0">rederive_memory</tspan><tspan x="240" dy="22">update, restore: re-embed outside</tspan><tspan x="240" dy="22">any tx, then rebuild links</tspan></text></g><g class="am9icy5ncmFwaA== job"><g class="shape" ><rect x="30" y="579" width="420" height="100" rx="8" stroke="#8a430a" fill="#b85c10" style="stroke-width:2;" /></g><text x="240" y="616" fill="#ffffff" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="240" dy="0">graph_maintenance</tspan><tspan x="240" dy="22">link top-ups, orphan</tspan><tspan x="240" dy="22">entity pruning</tspan></text></g><g class="am9icy5jb25zb2xpZGF0ZQ== job"><g class="shape" ><rect x="462" y="467" width="420" height="100" rx="8" strok