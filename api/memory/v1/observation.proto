// Observations for memd.
//
// Observations are derived memories that consolidation writes per tag scope from raw facts. A
// consolidate job runs one at a time per bank; automatic runs use bank config plus any matching
// consolidation strategy, never the overrides of the retain that triggered them. This file holds
// ObservationService: manual consolidation, scope listing, clears and consolidation-strategy preview.
syntax = "proto3";

package memory.v1;

import "memory/v1/common.proto";
import "memory/v1/config.proto";
import "memory/v1/operation.proto";

option go_package = "memd/gen/memory/v1;memoryv1";

// ObservationService runs and inspects consolidation.
service ObservationService {
  // Consolidate enqueues a manual consolidation, optionally limited to scopes and with its own overrides.
  // A job carrying overrides or scopes is never merged into another queued job.
  rpc Consolidate(ConsolidateRequest) returns (ConsolidateResponse);
  // ListScopes pages through the bank's observation scopes with counts.
  rpc ListScopes(ListScopesRequest) returns (ListScopesResponse);
  // ClearObservations deletes observations in the given scopes (or all) and resets their sources,
  // optionally re-consolidating.
  rpc ClearObservations(ClearObservationsRequest) returns (ClearObservationsResponse);
  // ClearMemoryObservations deletes the observations citing one unit and resets their co-sources,
  // optionally re-consolidating.
  rpc ClearMemoryObservations(ClearMemoryObservationsRequest) returns (ClearMemoryObservationsResponse);
  // PreviewConsolidationStrategies evaluates draft strategies against the bank's existing scopes without
  // saving them.
  rpc PreviewConsolidationStrategies(PreviewConsolidationStrategiesRequest) // split: 120-column limit
  returns (PreviewConsolidationStrategiesResponse);
}

// ConsolidateRequest asks for a manual consolidation run.
message ConsolidateRequest {
  // Bank to consolidate.
  string bank_id = 1;
  // Scopes to consolidate; empty = every scope.
  repeated TagSet scopes = 2;
  // Overrides for this run only (observations mission, caps, dedup threshold, strategies, CONSOLIDATE /
  // DEDUP_CHECK models); kept on the operation row.
  BankConfig overrides = 3;
}

// ConsolidateResponse carries the consolidation job.
message ConsolidateResponse {
  // The consolidate operation.
  Operation operation = 1;
}

// ScopeInfo describes one observation scope.
message ScopeInfo {
  // The scope's tag set; empty = the shared scope.
  TagSet scope = 1;
  // Observations in the scope.
  int64 observations = 2;
  // Units in the scope not yet consolidated.
  int64 unconsolidated_units = 3;
}

// ListScopesRequest pages the bank's scopes.
message ListScopesRequest {
  // Bank to list; unknown bank = NOT_FOUND.
  string bank_id = 1;
  // Maximum scopes per page; 0 = server default.
  int32 page_size = 2;
  // Token from a previous response; empty = first page.
  string page_token = 3;
}

// ListScopesResponse is one page of scopes.
message ListScopesResponse {
  // Scopes on this page.
  repeated ScopeInfo scopes = 1;
  // Token for the next page; empty = no more.
  string next_page_token = 2;
}

// ClearObservationsRequest deletes observations by scope.
message ClearObservationsRequest {
  // Bank to clear.
  string bank_id = 1;
  // Scopes to clear; empty = all scopes.
  repeated TagSet scopes = 2;
  // Enqueue a consolidation of the cleared sources afterwards.
  bool reconsolidate = 3;
}

// ClearObservationsResponse reports what was cleared.
message ClearObservationsResponse {
  // Observations deleted.
  int64 deleted = 1;
  // The consolidate operation; set only when reconsolidate was requested.
  Operation operation = 2;
}

// ClearMemoryObservationsRequest deletes the observations derived from one unit.
message ClearMemoryObservationsRequest {
  // Bank owning the unit.
  string bank_id = 1;
  // Unit whose citing observations are deleted.
  string memory_id = 2;
  // Enqueue a consolidation of the reset sources afterwards.
  bool reconsolidate = 3;
}

// ClearMemoryObservationsResponse reports what was cleared.
message ClearMemoryObservationsResponse {
  // Observations deleted.
  int64 deleted = 1;
  // The consolidate operation; set only when reconsolidate was requested.
  Operation operation = 2;
}

// PreviewConsolidationStrategiesRequest carries draft strategies to evaluate.
message PreviewConsolidationStrategiesRequest {
  // Bank whose existing scopes are matched.
  string bank_id = 1;
  // Draft strategies, in priority order (first match wins).
  repeated ConsolidationStrategy strategies = 2;
}

// StrategyMatch reports which scopes one draft strategy would take.
message StrategyMatch {
  // Strategy name.
  string strategy = 1;
  // Scopes the strategy would apply to.
  repeated string matched_scopes = 2;
  // Scopes its patterns match but an earlier strategy takes first.
  repeated string shadowed_scopes = 3;
}

// PreviewConsolidationStrategiesResponse reports the matches of every draft strategy.
message PreviewConsolidationStrategiesResponse {
  // One entry per draft strategy, in request order.
  repeated StrategyMatch matches = 1;
  // False when the preview stopped before checking every scope of the bank.
  bool complete = 2;
}
