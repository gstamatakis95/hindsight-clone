// Tenant configuration for memd.
//
// The tenant comes from the x-tenant-id metadata header, never from the request body. A tenant's
// BankConfig sits between the server defaults and each bank's own config in the hierarchy
// server < tenant < bank < strategy < request.
syntax = "proto3";

package memory.v1;

import "google/protobuf/field_mask.proto";
import "memory/v1/config.proto";

option go_package = "memd/gen/memory/v1;memoryv1";

// TenantService reads and patches the calling tenant's config defaults.
service TenantService {
  // GetTenantConfig returns the tenant-level BankConfig overrides.
  rpc GetTenantConfig(GetTenantConfigRequest) returns (GetTenantConfigResponse);
  // UpdateTenantConfig patches the tenant-level BankConfig with a FieldMask.
  rpc UpdateTenantConfig(UpdateTenantConfigRequest) returns (UpdateTenantConfigResponse);
}

// GetTenantConfigRequest is empty: the tenant comes from request metadata.
message GetTenantConfigRequest {}

// GetTenantConfigResponse carries the tenant's own overrides.
message GetTenantConfigResponse {
  // Tenant-level overrides; unset fields inherit server defaults.
  BankConfig config = 1;
}

// UpdateTenantConfigRequest patches the tenant config.
message UpdateTenantConfigRequest {
  // New values for the fields named in update_mask.
  BankConfig config = 1;
  // BankConfig paths to replace; a path set to an empty value clears it (this is how a list is cleared).
  google.protobuf.FieldMask update_mask = 2;
}

// UpdateTenantConfigResponse carries the tenant config after the patch.
message UpdateTenantConfigResponse {
  // Tenant-level overrides after the patch.
  BankConfig config = 1;
}
