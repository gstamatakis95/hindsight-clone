// Operations (background jobs) for memd.
//
// There is no broker: every background job is a row in the operations table, inserted in the same
// transaction as the state change that causes it, and claimed by workers with FOR UPDATE SKIP LOCKED.
// The operation id is the job id, so status, progress, cancel, retry, overrides and the owning bank all
// live on one row. This file holds the Operation message (returned by many services) and
// OperationService, which also serves ListEvents from events.proto.
syntax = "proto3";

package memory.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "memory/v1/common.proto";
import "memory/v1/config.proto";
import "memory/v1/events.proto";

option go_package = "memd/gen/memory/v1;memoryv1";

// OperationService reads and controls background operations and serves the lifecycle event feed.
service OperationService {
  // GetOperation returns one operation of the bank.
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);
  // ListOperations pages through the bank's operations, optionally filtered by status and kind.
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);
  // CancelOperation cancels a PENDING or PROCESSING operation. Cooperative: handlers stop at their next
  // checkpoint and committed work stays; workers never overwrite CANCELLED.
  rpc CancelOperation(CancelOperationRequest) returns (CancelOperationResponse);
  // RetryOperation re-queues a FAILED or CANCELLED operation (PENDING, run now); other states are rejected.
  rpc RetryOperation(RetryOperationRequest) returns (RetryOperationResponse);
  // ListEvents polls the bank's lifecycle events by sequence number.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
}

// OperationStatus is the lifecycle state of an operation.
enum OperationStatus {
  // Not set; in ListOperations it means no status filter.
  OPERATION_STATUS_UNSPECIFIED = 0;
  // Queued, possibly parked until next_run_at.
  OPERATION_STATUS_PENDING = 1;
  // Claimed by a worker, which heartbeats it; reclaimed to PENDING if the heartbeat is over 2 minutes old.
  OPERATION_STATUS_PROCESSING = 2;
  // Finished successfully. Terminal; pruned after the retention period.
  OPERATION_STATUS_COMPLETED = 3;
  // Failed with error after its retries (or at once for deterministic errors). Terminal; RetryOperation
  // re-queues it.
  OPERATION_STATUS_FAILED = 4;
  // Cancelled by CancelOperation or DeleteBank. Terminal; RetryOperation re-queues it.
  OPERATION_STATUS_CANCELLED = 5;
}

// OperationKind is the job type of an operation.
enum OperationKind {
  // Not set; in ListOperations it means no kind filter.
  OPERATION_KIND_UNSPECIFIED = 0;
  // Parent of one retain_document child per document; its status aggregates its children.
  OPERATION_KIND_RETAIN_BATCH = 1;
  // Extract, embed, resolve and link one document; resumes by chunk hash; enqueues consolidation.
  OPERATION_KIND_RETAIN_DOCUMENT = 2;
  // Consolidate the bank's oldest unconsolidated units into observations; one at a time per bank.
  OPERATION_KIND_CONSOLIDATE = 3;
  // Re-embed, re-resolve and re-link a curated unit, then enqueue consolidation.
  OPERATION_KIND_REDERIVE_MEMORY = 4;
  // Rewrite a document's unit tags, clear their observations and enqueue consolidation.
  OPERATION_KIND_RETAG_DOCUMENT = 5;
  // Refresh one mental model (agentic or single-shot, delta or full) and write a version.
  OPERATION_KIND_REFRESH_MENTAL_MODEL = 6;
  // Refill links of neighbours of removed units and prune orphaned entities; one at a time per bank.
  OPERATION_KIND_GRAPH_MAINTENANCE = 7;
  // Delete all of a tombstoned bank's rows and blobs, then the bank row.
  OPERATION_KIND_DELETE_BANK = 8;
}

// Progress is the last checkpoint a handler reported.
message Progress {
  // Handler-defined stage name.
  string stage = 1;
  // When the checkpoint was written.
  google.protobuf.Timestamp at = 2;
  // Items done so far in this stage.
  int64 processed = 3;
  // Items in this stage, if known; 0 = unknown.
  int64 total = 4;
}

// Operation is one background job row.
message Operation {
  // Operation (job) id.
  string id = 1;
  // Job type.
  OperationKind kind = 2;
  // Lifecycle state.
  OperationStatus status = 3;
  // Last error message; set when FAILED.
  string error = 4;
  // Kind-specific summary of the outcome; informational only, not a stable contract.
  google.protobuf.Struct result = 5;
  // Token usage per slot and model of every LLM call the job made.
  repeated SlotUsage usage = 6;
  // The overrides the run actually used (request, strategy and stored overrides merged).
  BankConfig effective_overrides = 7;
  // Parent operation (a retain_batch); empty for top-level operations.
  string parent_id = 8;
  // Last reported checkpoint.
  Progress progress = 9;
  // When the operation was enqueued.
  google.protobuf.Timestamp created_at = 10;
  // Last change to the row.
  google.protobuf.Timestamp updated_at = 11;
  // When a parked job becomes claimable: backoff, debounce or refresh interval floor.
  google.protobuf.Timestamp next_run_at = 12;
  // Claims so far; transient failures retry with backoff (60 s x attempt) up to the kind's limit.
  int32 attempts = 13;
  // Worker liveness while PROCESSING; the runner heartbeats every 15 s.
  google.protobuf.Timestamp heartbeat_at = 14;
}

// GetOperationRequest names one operation.
message GetOperationRequest {
  // Bank owning the operation; unknown bank = NOT_FOUND.
  string bank_id = 1;
  // Operation id.
  string operation_id = 2;
}

// GetOperationResponse carries the operation.
message GetOperationResponse {
  // The operation, with its current status, progress and usage.
  Operation operation = 1;
}

// ListOperationsRequest filters and pages the bank's operations.
message ListOperationsRequest {
  // Bank to list; unknown bank = NOT_FOUND.
  string bank_id = 1;
  // Only this status; unspecified = any.
  OperationStatus status = 2;
  // Only this kind; unspecified = any.
  OperationKind kind = 3;
  // Omit retain_batch parents, listing only operations that do work.
  bool exclude_parents = 4;
  // Maximum operations per page; 0 = server default.
  int32 page_size = 5;
  // Token from a previous response; empty = first page.
  string page_token = 6;
}

// ListOperationsResponse is one page of operations.
message ListOperationsResponse {
  // Operations on this page.
  repeated Operation operations = 1;
  // Token for the next page; empty = no more.
  string next_page_token = 2;
}

// CancelOperationRequest names the operation to cancel.
message CancelOperationRequest {
  // Bank owning the operation.
  string bank_id = 1;
  // Operation id; must be PENDING or PROCESSING.
  string operation_id = 2;
}

// CancelOperationResponse carries the cancelled operation.
message CancelOperationResponse {
  // The operation, now CANCELLED.
  Operation operation = 1;
}

// RetryOperationRequest names the operation to retry.
message RetryOperationRequest {
  // Bank owning the operation.
  string bank_id = 1;
  // Operation id; must be FAILED or CANCELLED.
  string operation_id = 2;
}

// RetryOperationResponse carries the re-queued operation.
message RetryOperationResponse {
  // The operation, now PENDING with next_run_at = now.
  Operation operation = 1;
}
