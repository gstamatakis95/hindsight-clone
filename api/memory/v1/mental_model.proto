// Mental models (knowledge pages) for memd.
//
// A mental model is a Markdown page synthesized from a bank's memories for a source query, organized in
// folders and kept fresh by refresh jobs. A refresh is agentic (the reflect loop) or single-shot (one
// recall plus one SYNTHESIZE / MENTAL_MODEL_DELTA call), and full or delta. Refreshes of one model never
// overlap; a model has at most one queued refresh, and a failed refresh pauses automatic triggers until a
// manual refresh succeeds. This file holds MentalModelService, page search and the refresh trace.
syntax = "proto3";

package memory.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "memory/v1/common.proto";
import "memory/v1/config.proto";
import "memory/v1/operation.proto";

option go_package = "memd/gen/memory/v1;memoryv1";

// MentalModelService creates, reads, refreshes and searches mental models.
service MentalModelService {
  // CreateMentalModel stores a model and enqueues its first build asynchronously.
  rpc CreateMentalModel(CreateMentalModelRequest) returns (CreateMentalModelResponse);
  // GetMentalModel returns one model at the requested detail, default DETAIL_FULL.
  rpc GetMentalModel(GetMentalModelRequest) returns (GetMentalModelResponse);
  // ListMentalModels pages through models with filters, default DETAIL_METADATA.
  rpc ListMentalModels(ListMentalModelsRequest) returns (ListMentalModelsResponse);
  // UpdateMentalModel patches a model's spec with a FieldMask.
  rpc UpdateMentalModel(UpdateMentalModelRequest) returns (UpdateMentalModelResponse);
  // RefreshMentalModel enqueues a manual refresh. It ignores the interval floor, releases a parked
  // refresh, joins and upgrades a queued one, and on success clears auto_refresh_paused.
  rpc RefreshMentalModel(RefreshMentalModelRequest) returns (RefreshMentalModelResponse);
  // DryRunRefresh runs the full refresh pipeline synchronously within the RPC deadline and writes nothing,
  // not even usage.
  rpc DryRunRefresh(DryRunRefreshRequest) returns (DryRunRefreshResponse);
  // ClearMentalModel empties a model's content so that its next refresh is full.
  rpc ClearMentalModel(ClearMentalModelRequest) returns (ClearMentalModelResponse);
  // GetMentalModelHistory pages through a model's versions and refresh failures.
  rpc GetMentalModelHistory(GetMentalModelHistoryRequest) returns (GetMentalModelHistoryResponse);
  // DeleteMentalModel deletes one model and its history.
  rpc DeleteMentalModel(DeleteMentalModelRequest) returns (DeleteMentalModelResponse);
  // DeleteFolder deletes every model under a folder path, recursively.
  rpc DeleteFolder(DeleteFolderRequest) returns (DeleteFolderResponse);
  // SearchPages ranks whole pages by fused full-text and semantic scores, without rerank.
  rpc SearchPages(SearchPagesRequest) returns (SearchPagesResponse);
}

// Detail picks how much of a mental model a read returns.
enum Detail {
  // Not set; the RPC's default applies (GetMentalModel: FULL, ListMentalModels: METADATA).
  DETAIL_UNSPECIFIED = 0;
  // Spec and status fields only, no content.
  DETAIL_METADATA = 1;
  // Metadata plus content_md and structured_output_json.
  DETAIL_CONTENT = 2;
  // Everything, including source_ids and last_trace.
  DETAIL_FULL = 3;
}

// RefreshTrigger decides when and how a model refreshes, and what scope it reads. Unset fields fall back
// to MentalModelConfig.
message RefreshTrigger {
  // Full or delta; unset = MentalModelConfig.default_mode.
  RefreshMode mode = 1;
  // Agentic or single-shot; unset = MentalModelConfig.default_strategy.
  RefreshStrategy strategy = 18;
  // Refresh after a consolidation changes an in-scope unit or observation; exclusive with refresh_cron.
  bool refresh_after_consolidation = 2;
  // Cron schedule for refreshes, UTC, 5 fields; exclusive with refresh_after_consolidation.
  string refresh_cron = 3;
  // Minimum seconds between triggered refreshes; unset = MentalModelConfig value.
  optional int32 min_refresh_interval_seconds = 4;
  // How the model's tags filter memories, default TAGS_MATCH_ALL_STRICT when the model is tagged.
  TagsMatch tags_match = 5;
  // Boolean tag filter, top-level groups AND-ed; when set it replaces the model's tags and tags_match.
  repeated TagGroup tag_groups = 6;
  // Fact types in scope; empty = all.
  repeated FactType fact_types = 7;
  // Do not read other mental models while refreshing.
  bool exclude_mental_models = 8;
  // Mental models never read while refreshing.
  repeated string exclude_mental_model_ids = 9;
  // Include source chunks in recall results.
  optional bool include_chunks = 10;
  // Token cap on one recall during refresh.
  optional int32 recall_max_tokens = 11;
  // Token cap on chunks attached to a recall during refresh.
  optional int32 recall_chunks_max_tokens = 12;
  // Token cap on one search_observations result during refresh.
  optional int32 search_observations_max_tokens = 13;
  // Include entity state in search_observations results during refresh.
  optional bool search_observations_include_entities = 14;
  // Size class of the refresh, default BUDGET_MID.
  Budget budget = 15;
  // JSON Schema for structured output projected from the page; empty = none.
  string response_schema_json = 16;
  // Keep the last refresh trace on the model (MentalModel.last_trace).
  bool keep_trace = 17;
}

// MentalModelSpec is the writable part of a mental model.
message MentalModelSpec {
  // Model id: lowercase alphanumerics and hyphens, unique per (tenant, bank).
  string id = 1;
  // Display name.
  string name = 2;
  // The question the page answers; changing it forces the next refresh to be full.
  string source_query = 3;
  // Folder the page lives in, for example team/projects.
  string folder_path = 4;
  // Tags that scope what the model reads and when it goes stale.
  repeated string tags = 5;
  // Token cap on the content; overrides MentalModelConfig.max_content_tokens.
  optional int32 max_tokens = 6;
  // Refresh trigger, mode, strategy and scope.
  RefreshTrigger trigger = 7;
  // Overrides stored on the model and applied to every refresh (reflect and mental-model config, refresh
  // strategy, REFLECT / SYNTHESIZE / MENTAL_MODEL_DELTA / STRUCTURED_OUTPUT models); other fields =
  // INVALID_ARGUMENT.
  BankConfig overrides = 8;
}

// MentalModel is a stored mental model with its content and refresh state.
message MentalModel {
  // The writable spec.
  MentalModelSpec spec = 1;
  // Bank owning the model.
  string bank_id = 2;
  // Page content in Markdown.
  string content_md = 3;
  // Structured output matching the trigger's response_schema_json; empty when none.
  string structured_output_json = 4;
  // Content version, incremented on every write.
  int64 version = 5;
  // True when an in-scope unit or observation changed after last_seq_seen, or a source was retracted.
  bool is_stale = 6;
  // Wall clock of the last completed refresh, including no-op refreshes.
  google.protobuf.Timestamp last_refreshed_at = 7;
  // The bank change_seq the last successful refresh read up to (its watermark).
  int64 last_seq_seen = 8;
  // When the last refresh failed; unset if none has.
  google.protobuf.Timestamp last_refresh_failed_at = 9;
  // Set by a failed refresh; automatic triggers skip the model until a manual refresh succeeds.
  bool auto_refresh_paused = 10;
  // Cumulative based_on ids; pruned on full refresh and on invalidate.
  repeated string source_ids = 11;
  // Trace of the last refresh when keep_trace; DETAIL_FULL only.
  RefreshTrace last_trace = 12;
  // When the model was created.
  google.protobuf.Timestamp created_at = 13;
}

// CreateMentalModelRequest creates a model.
message CreateMentalModelRequest {
  // Bank to create it in.
  string bank_id = 1;
  // The model's spec; spec.id must be unique in the bank.
  MentalModelSpec spec = 2;
}

// CreateMentalModelResponse carries the new model and its first build.
message CreateMentalModelResponse {
  // The model, with no content yet.
  MentalModel mental_model = 1;
  // The refresh_mental_model operation building the first version.
  Operation build = 2;
}

// GetMentalModelRequest names one model.
message GetMentalModelRequest {
  // Bank owning the model; unknown bank = NOT_FOUND.
  string bank_id = 1;
  // Model id.
  string mental_model_id = 2;
  // How much to return, default DETAIL_FULL.
  Detail detail = 3;
}

// GetMentalModelResponse carries the model.
message GetMentalModelResponse {
  // The model at the requested detail; content is the latest version.
  MentalModel mental_model = 1;
}

// ListMentalModelsRequest filters and pages the bank's models.
message ListMentalModelsRequest {
  // Bank to list; unknown bank = NOT_FOUND.
  string bank_id = 1;
  // Only models whose folder path starts with this; empty = all.
  string folder_prefix = 2;
  // How much of each model to return, default DETAIL_METADATA.
  Detail detail = 3;
  // Tag filter on the models' tags.
  repeated string tags = 4;
  // How tags must match.
  TagsMatch tags_match = 5;
  // Maximum models per page; 0 = server default.
  int32 page_size = 6;
  // Token from a previous response; empty = first page.
  string page_token = 7;
}

// ListMentalModelsResponse is one page of models.
message ListMentalModelsResponse {
  // Models on this page.
  repeated MentalModel mental_models = 1;
  // Token for the next page; empty = no more.
  string next_page_token = 2;
}

// UpdateMentalModelRequest patches a model's spec.
message UpdateMentalModelRequest {
  // Bank owning the model.
  string bank_id = 1;
  // Model id.
  string mental_model_id = 2;
  // New values for the fields named in update_mask.
  MentalModelSpec spec = 3;
  // MentalModelSpec paths to replace; a path set to an empty value clears it.
  google.protobuf.FieldMask update_mask = 4;
}

// UpdateMentalModelResponse carries the patched model.
message UpdateMentalModelResponse {
  // The model after the patch.
  MentalModel mental_model = 1;
}

// RefreshMentalModelRequest asks for a manual refresh.
message RefreshMentalModelRequest {
  // Bank owning the model.
  string bank_id = 1;
  // Model id.
  string mental_model_id = 2;
  // Force a full refresh; OR-ed into a queued refresh this joins.
  bool force_full = 3;
  // Overrides for this refresh only (reflect and mental-model config, refresh strategy, REFLECT /
  // SYNTHESIZE / MENTAL_MODEL_DELTA / STRUCTURED_OUTPUT models); other fields = INVALID_ARGUMENT. Kept on
  // the operation; they replace a queued refresh's overrides.
  BankConfig overrides = 4;
  // Per-call override of the trigger's strategy; unset = the trigger's.
  RefreshStrategy strategy = 5;
}

// RefreshMentalModelResponse carries the refresh job.
message RefreshMentalModelResponse {
  // The refresh_mental_model operation (new, or the queued one that was joined).
  Operation operation = 1;
  // True when the request joined and upgraded an already queued refresh.
  bool joined_queued = 2;
}

// DryRunRefreshRequest asks for a refresh that writes nothing.
message DryRunRefreshRequest {
  // Bank owning the model.
  string bank_id = 1;
  // Model id.
  string mental_model_id = 2;
  // Strategy to dry-run; unset = the trigger's.
  RefreshStrategy strategy = 3;
}

// DeltaOp is one edit operation of a delta refresh.
message DeltaOp {
  // Kind is the edit an op performs on the page's sections and blocks.
  enum Kind {
    // Not set; rejected.
    KIND_UNSPECIFIED = 0;
    // Add a section with heading and blocks_md.
    KIND_ADD_SECTION = 1;
    // Remove section_id.
    KIND_REMOVE_SECTION = 2;
    // Rename section_id to heading.
    KIND_RENAME_SECTION = 3;
    // Replace every block of section_id with blocks_md.
    KIND_REPLACE_SECTION_BLOCKS = 4;
    // Append blocks_md to the end of section_id.
    KIND_APPEND_BLOCK = 5;
    // Insert blocks_md after after_block_id.
    KIND_INSERT_BLOCK = 6;
    // Replace block_id with blocks_md.
    KIND_REPLACE_BLOCK = 7;
    // Remove block_id.
    KIND_REMOVE_BLOCK = 8;
  }
  // The edit to perform; decides which of the other fields apply.
  Kind kind = 1;
  // Target section id.
  string section_id = 2;
  // Target block id.
  string block_id = 3;
  // Block to insert after (KIND_INSERT_BLOCK).
  string after_block_id = 4;
  // Section heading (KIND_ADD_SECTION, KIND_RENAME_SECTION).
  string heading = 5;
  // New Markdown blocks.
  repeated string blocks_md = 6;
  // Whether the op applied cleanly.
  bool applied = 7;
  // Why the op was rejected, for example an unknown id; empty when applied.
  string skip_reason = 8;
}

// RefreshOutcome is the result of one refresh.
enum RefreshOutcome {
  // Not set; never stored.
  REFRESH_OUTCOME_UNSPECIFIED = 0;
  // A new version of the content was written.
  REFRESH_OUTCOME_CONTENT_WRITTEN = 1;
  // Nothing was in scope or in the window; no LLM call, only last_refreshed_at advanced.
  REFRESH_OUTCOME_NO_NEW_FACTS = 2;
  // The refresh failed; the stored content is unchanged.
  REFRESH_OUTCOME_FAILED = 3;
}

// RefreshTrace explains one refresh or dry run.
message RefreshTrace {
  // Mode actually used.
  RefreshMode effective_mode = 1;
  // Why a delta refresh ran full: no_baseline_content, source_query_changed, ...; empty if it did not.
  string mode_fallback_reason = 2;
  // Result of the refresh.
  RefreshOutcome outcome = 3;
  // Tool calls of the reflect loop; REFRESH_STRATEGY_AGENTIC only.
  repeated ToolCallTrace tool_calls = 4;
  // Edit ops of a delta refresh, with whether each applied.
  repeated DeltaOp delta_operations = 5;
  // Token usage per slot and model.
  repeated SlotUsage usage = 6;
  // When the trace was recorded.
  google.protobuf.Timestamp recorded_at = 7;
  // Total refresh wall time in milliseconds.
  int64 duration_ms = 8;
  // Non-fatal problems, for example dropped citations or truncated content.
  repeated string warnings = 9;
  // Strategy actually used.
  RefreshStrategy effective_strategy = 10;
}

// ResolvedScope is the effective filter a refresh reads with, after defaults and overrides.
message ResolvedScope {
  // Effective flat tags.
  repeated string tags = 1;
  // Effective tag match.
  TagsMatch tags_match = 2;
  // Effective tag groups, top-level groups AND-ed; when set they replace tags and tags_match.
  repeated TagGroup tag_groups = 3;
  // Effective fact types; empty = all.
  repeated FactType fact_types = 4;
}

// DryRunRefreshResponse reports what a refresh would do.
message DryRunRefreshResponse {
  // Mode the trigger and state ask for, before any fallback.
  RefreshMode requested_mode = 1;
  // Trace of the dry run, including the effective mode and outcome.
  RefreshTrace trace = 2;
  // Scope the refresh read with.
  ResolvedScope resolved_scope = 3;
  // Lower bound of the change window (exclusive): the model's last_seq_seen.
  int64 window_after_seq = 4;
  // Upper bound of the change window (inclusive): the bank change_seq read at the start.
  int64 window_before_seq = 5;
  // Facts the retrieval returned.
  int32 facts_retrieved = 6;
  // Facts the draft cites.
  int32 facts_used = 7;
  // Unified diff of the draft against the stored content.
  string diff = 8;
  // Whether a real refresh would write a new version.
  bool would_persist = 9;
}

// HistoryKind separates content versions from refresh failures; each is capped separately.
enum HistoryKind {
  // Not set; in GetMentalModelHistory it means both kinds.
  HISTORY_KIND_UNSPECIFIED = 0;
  // A previous content version.
  HISTORY_KIND_VERSION = 1;
  // A failed refresh.
  HISTORY_KIND_REFRESH_FAILED = 2;
}

// MentalModelHistoryEntry is one history row of a model.
message MentalModelHistoryEntry {
  // Version or failure.
  HistoryKind kind = 1;
  // Content before the change (HISTORY_KIND_VERSION).
  string previous_content = 2;
  // When the entry was recorded.
  google.protobuf.Timestamp changed_at = 3;
  // Outcome of the refresh behind the entry.
  RefreshOutcome outcome = 4;
  // Machine-readable failure reason (HISTORY_KIND_REFRESH_FAILED).
  string failure_reason = 5;
  // Error message of the failure (HISTORY_KIND_REFRESH_FAILED).
  string error_message = 6;
}

// ClearMentalModelRequest names the model to clear.
message ClearMentalModelRequest {
  // Bank owning the model.
  string bank_id = 1;
  // Model id.
  string mental_model_id = 2;
}

// ClearMentalModelResponse carries the cleared model.
message ClearMentalModelResponse {
  // The model with empty content; its next refresh is full.
  MentalModel mental_model = 1;
}

// GetMentalModelHistoryRequest pages a model's history.
message GetMentalModelHistoryRequest {
  // Bank owning the model; unknown bank = NOT_FOUND.
  string bank_id = 1;
  // Model id.
  string mental_model_id = 2;
  // Only this kind; unspecified = both.
  HistoryKind kind = 3;
  // Maximum entries per page; 0 = server default.
  int32 page_size = 4;
  // Token from a previous response; empty = first page.
  string page_token = 5;
}

// GetMentalModelHistoryResponse is one page of history, newest first.
message GetMentalModelHistoryResponse {
  // Entries on this page.
  repeated MentalModelHistoryEntry entries = 1;
  // Token for the next page; empty = no more.
  string next_page_token = 2;
}

// DeleteMentalModelRequest names the model to delete.
message DeleteMentalModelRequest {
  // Bank owning the model.
  string bank_id = 1;
  // Model id.
  string mental_model_id = 2;
}

// DeleteMentalModelResponse is empty on success.
message DeleteMentalModelResponse {}

// DeleteFolderRequest names the folder to delete.
message DeleteFolderRequest {
  // Bank owning the folder.
  string bank_id = 1;
  // Folder path; every model under it is deleted, recursively.
  string folder_path = 2;
}

// DeleteFolderResponse reports how many models were deleted.
message DeleteFolderResponse {
  // Models deleted.
  int32 deleted = 1;
}

// SearchPagesRequest searches mental-model pages.
message SearchPagesRequest {
  // Bank to search; unknown bank = NOT_FOUND.
  string bank_id = 1;
  // Search text.
  string query = 2;
  // Only pages whose folder path starts with this; empty = all.
  string folder_prefix = 3;
  // Maximum hits; 0 = server default.
  int32 limit = 4;
}

// PageHit is one page matching a search.
message PageHit {
  // Model id.
  string mental_model_id = 1;
  // Folder the page lives in.
  string folder_path = 2;
  // Page name.
  string name = 3;
  // Matching excerpt of the content.
  string snippet = 4;
  // Fused full-text and semantic score; hits are ordered by it.
  double score = 5;
}

// SearchPagesResponse lists matching pages.
message SearchPagesResponse {
  // Hits, best first.
  repeated PageHit hits = 1;
}
