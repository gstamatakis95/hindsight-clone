// Model routing for memd.
//
// Every LLM-backed operation has its own slot, and each slot binds to any gateway model with its own
// parameters. Bindings merge per slot across server < tenant < bank < strategy < request: the most
// specific level that sets a slot wins, and setting one slot never clears the others. This file is a
// leaf of the import graph: it depends only on google.protobuf well-known types.
syntax = "proto3";

package memory.v1;

import "google/protobuf/struct.proto";

option go_package = "memd/gen/memory/v1;memoryv1";

// ModelSlot names one LLM-backed operation that can be routed to its own gateway model.
enum ModelSlot {
  // Not set; invalid in a SlotBinding and never recorded in usage.
  MODEL_SLOT_UNSPECIFIED = 0;
  // Retain fact, entity and label extraction. Overridable on RetainRequest.
  MODEL_SLOT_EXTRACT = 1;
  // Relative dates at retain, and query time windows at recall (only when a cue is found and the rules
  // fail). Overridable on RetainRequest and RecallRequest.
  MODEL_SLOT_TIME_PARSE = 2;
  // Create / update / none decisions per observation scope. Overridable on a manual Consolidate request
  // or the matching consolidation strategy, never by the retain that triggered the consolidation.
  MODEL_SLOT_CONSOLIDATE = 3;
  // Merge-or-keep check for near-duplicate observations. Overridable like MODEL_SLOT_CONSOLIDATE.
  MODEL_SLOT_DEDUP_CHECK = 4;
  // Tool-calling turns of the reflect loop and of agentic mental-model refresh. Overridable on
  // ReflectRequest and RefreshMentalModel.
  MODEL_SLOT_REFLECT = 5;
  // Second pass projecting prose into a JSON Schema (response_schema_json). Overridable on ReflectRequest.
  MODEL_SLOT_STRUCTURED_OUTPUT = 6;
  // Edit ops for incremental (delta) mental-model page refresh. Overridable on RefreshMentalModel or
  // stored on the model.
  MODEL_SLOT_MENTAL_MODEL_DELTA = 7;
  // Cross-encoder scores in recall. Overridable on RecallRequest.
  MODEL_SLOT_RERANK = 8;
  // Embeddings of units, observations, queries and pages. Usage accounting only: the embedding model is
  // server-wide (nomic-embed-text-v1.5, 768 dims) and can never be bound in BankConfig.
  MODEL_SLOT_EMBED = 9;
  // Single-shot (full) mental-model refresh. Overridable on RefreshMentalModel or stored on the model.
  MODEL_SLOT_SYNTHESIZE = 10;
}

// ModelBinding is the gateway model and call parameters used for one slot. Unset optional fields fall
// through to the next less specific level, and finally to the gateway's defaults.
message ModelBinding {
  // Gateway model name, as sent in the OpenAI-compatible request.
  string model = 1;
  // Sampling temperature; unset = inherited.
  optional double temperature = 2;
  // Nucleus sampling cutoff; unset = inherited.
  optional double top_p = 3;
  // Maximum output tokens per call; unset = inherited.
  optional int32 max_output_tokens = 4;
  // Reasoning effort hint (for example low, medium, high); empty = inherited.
  string reasoning_effort = 5;
  // Per-call timeout in milliseconds; unset = inherited.
  optional int32 timeout_ms = 6;
  // Gateway-call retries on transient errors; unset = inherited.
  optional int32 max_retries = 7;
  // Free-form object passed through to the OpenAI-compatible request body untouched.
  google.protobuf.Struct extra = 8;
}

// SlotBinding binds one slot to a model. A list of them merges per slot across config levels.
message SlotBinding {
  // The slot being bound; MODEL_SLOT_EMBED is rejected in config.
  ModelSlot slot = 1;
  // The model and parameters for the slot.
  ModelBinding binding = 2;
}
