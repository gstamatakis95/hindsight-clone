# Alembic config for memd. The database URL is not set here: env.py reads MEMD_DSN or
# DATABASE_URL (default postgresql+psycopg://memd:memd@localhost:${MEMD_PG_PORT:-55432}/memd).

[alembic]
script_location = %(here)s
version_locations = %(here)s/versions
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
