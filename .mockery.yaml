# mockery v3: mocks of the boundary interfaces tests stub, written to internal/mocks/<path relative to internal/>, one
# Go package per source package (package mock<name>). Only the model boundary is mocked: store code is tested against
# real Postgres (internal/store/postgres/pgtest), and the blob store and the other model calls use the in-memory
# fakes in internal/fake. Add an interface here when a test needs it. The matryer (moq-style) template needs only
# the standard library; testify is not an approved dependency. Never hand-edit the output; run `make gen`.
template: matryer
all: false
include-auto-generated: false
force-file-write: true
formatter: goimports
dir: 'internal/mocks/{{ trimPrefix "internal/" .InterfaceDirRelative }}'
filename: mocks.go
pkgname: 'mock{{ .SrcPackageName }}'
structname: '{{ .InterfaceName }}'
packages:
  memd/internal/ai:
    interfaces:
      Embedder: {}
      LLM: {}
