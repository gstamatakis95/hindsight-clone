# mockery v3: mocks of the interfaces tests stub (the AI and blob boundaries, the config resolver, the engines'
# consumer interfaces and operation control), written to internal/mocks/<path relative to internal/>, one Go
# package per source package (package mock<name>). Store code is tested against real Postgres
# (internal/store/postgres/pgtest), so the store package has no mocks. Add an interface here when a test needs it. The matryer (moq-style) template needs only the standard library; testify is not an approved
# dependency. Never hand-edit the output; run `make gen`.
template: matryer
all: false
include-auto-generated: false
force-file-write: true
formatter: goimports
dir: 'internal/mocks/{{ trimPrefix "internal/" .InterfaceDirRelative }}'
filename: mocks.go
pkgname: 'mock{{ .SrcPackageName }}'
structname: '{{ .InterfaceName }}'
packages:
  memd/internal/ai:
    interfaces:
      Embedder: {}
      LLM: {}
      Reranker: {}
  memd/internal/blob:
    interfaces:
      Store: {}
  memd/internal/engine/bank:
    interfaces:
      BankDeleter: {}
      PromptPreviewer: {}
      StatsReader: {}
      TemplateCodec: {}
  memd/internal/engine/consolidate:
    interfaces:
      Consolidator: {}
      StrategyPreviewer: {}
  memd/internal/engine/curate:
    interfaces:
      Curator: {}
      MemoryLister: {}
      Rederiver: {}
  memd/internal/engine/docs:
    interfaces:
      Retagger: {}
  memd/internal/engine/retain:
    interfaces:
      Ingestor: {}
      Retainer: {}
  memd/internal/jobs:
    interfaces:
      OperationControl: {}
